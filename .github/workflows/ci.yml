name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get install -y libxmlsec1-dev pkg-config
      - run: uv sync
      - run: uv run python tools/check_confidential.py
      - run: uv run pytest -q
